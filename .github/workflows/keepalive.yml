name: Keep Supabase awake

# Free Supabase projects pause after about a week with no database activity.
# This calls the public settings row twice a week. It uses the anon key, which can only read.
on:
  schedule:
    - cron: "0 6 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read site settings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail-with-body --silent --show-error \
            "$SUPABASE_URL/rest/v1/site_settings?select=id&id=eq.1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
